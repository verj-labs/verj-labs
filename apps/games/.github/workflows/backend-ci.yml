name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - '01-shah-game/backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - '01-shah-game/backend/**'

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://shah:shah_secret@localhost:5432/shah_exchange_test
  REDIS_URL: redis://localhost:6379
  SESSION_SECRET: ci-test-secret-not-for-production

defaults:
  run:
    working-directory: 01-shah-game/backend

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shah
          POSTGRES_PASSWORD: shah_secret
          POSTGRES_DB: shah_exchange_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-backend-${{ hashFiles('01-shah-game/backend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-backend-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Run database migrations
        run: pnpm exec prisma migrate deploy

      - name: Lint
        run: pnpm lint:ci

      - name: Run unit tests
        run: pnpm test --passWithNoTests

      - name: Build
        run: pnpm build
